<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Panel Conductor - ATP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
  <link rel="stylesheet" href="css/cdr.css">

  <style>
    /* === Ajuste estético nuevo para botones === */
    .btn-action {
      padding: 8px 14px;
      border-radius: 12px;
      border: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start {
      background: #9cc84b; /* Verde suave como tu diseño */
    }

    .btn-start:hover {
      background: #8ab63f;
    }

    .btn-end {
      background: #d64545; /* Rojo elegante */
    }

    .btn-end:hover {
      background: #c23a3a;
    }

    /* Colores para los estados */
    .badge.ASIGNADA {
      background: #1B9C85;
      color: #fff;
      border: none;
    }

    .badge.EN_CURSO {
      background: #F7D060;
      color: #000;
      border: none;
    }

    .badge.COMPLETADA {
      background: #4CAF50;  /* Verde diferente al de ASIGNADA */
      color: #fff;
      border: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <aside>
      <div class="toggle">
        <div class="logo">
          <img src="/imagenes/ImagenChileOpen.png" alt="logo">
        </div>
        <div class="close" id="close-btn"><span class="material-icons-sharp">close</span></div>
      </div>

      <div class="sidebar">
        <a href="infoconductor.html"><span class="material-icons-sharp">person_outline</span><h3>Mi información</h3></a>
        <a href="panelconductor.html" class="active"><span class="material-icons-sharp">directions_car</span><h3>Mis Viajes</h3></a>
        <a href="loginconductor.html" id="btn-logout"><span class="material-icons-sharp">logout</span><h3>Cerrar Sesión</h3></a>
      </div>
    </aside>

    <main>
      <h1>Mis Viajes</h1>

      <div class="recent-orders">
        <div class="card">
          <div class="table-wrap">
            <table class="table" aria-label="Viajes asignados">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Origen</th>
                  <th>Destino</th>
                  <th>Fecha</th>
                  <th>Estado</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tbody-viajes">
                <tr><td colspan="6" style="text-align:center;">Cargando viajes...</td></tr>
              </tbody>
            </table>
          </div>
          <div style="padding:12px;"><span id="status" class="buscar">—</span></div>
        </div>
      </div>
    </main>

    <div class="right-section">
      <div class="nav">
        <button id="menu-btn"><span class="material-icons-sharp">menu</span></button>

        <div id="theme-toggle" class="dark-mode" role="button" aria-label="Cambiar tema">
          <span class="material-icons-sharp" data-theme-target="light">light_mode</span>
          <span class="material-icons-sharp" data-theme-target="dark">dark_mode</span>
        </div>

        <div class="profile">
          <div class="info">
            <p>Hola, <b id="driverName">Conductor</b></p>
            <small class="text-muted">¡Buen viaje!</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== JS ====== -->
  <script>
    /* ------------------------- TEMA ---------------------------- */
    (function themeInit(){
      const toggle = document.getElementById('theme-toggle');
      const sun  = toggle.querySelector('[data-theme-target="light"]');
      const moon = toggle.querySelector('[data-theme-target="dark"]');
      function apply(theme){
        document.body.classList.toggle('dark-mode-variables', theme === 'dark');
        sun.classList.toggle('active', theme === 'light');
        moon.classList.toggle('active', theme === 'dark');
        localStorage.setItem('theme', theme);
      }
      apply(localStorage.getItem('theme') || 'light');
      toggle.addEventListener('click', () => {
        const next = document.body.classList.contains('dark-mode-variables') ? 'light' : 'dark';
        apply(next);
      });
    })();

    /* ------------------------- CONFIG ---------------------------- */
    const API_BASE = "https://occurrence-problems-consistent-franklin.trycloudflare.com/api";

    const conductorData = JSON.parse(localStorage.getItem("conductor"));
    const conductorId   = conductorData?.id || null;
    const driverNameEl  = document.getElementById('driverName');

    if (!conductorId) {
      alert("Por favor, inicia sesión nuevamente.");
      window.location.href = "loginconductor.html";
    } else {
      const nombre = [conductorData?.nombre, conductorData?.apellido].filter(Boolean).join(' ').trim();
      if (nombre) driverNameEl.textContent = nombre;
    }

    const $tbody  = document.getElementById("tbody-viajes");
    const $status = document.getElementById("status");

    function headersJSON() {
      const h = { "Accept": "application/json" };
      const bearer = localStorage.getItem("conductor_token");
      if (bearer) h["Authorization"] = "Bearer " + bearer;
      return h;
    }
    
    function fmtDateTime(s){
      if(!s) return "-";
      const d = new Date(s);
      return isNaN(+d) ? "-" : d.toLocaleString();
    }

    /* ------------------------ COORDENADAS ------------------------ */
    const PLACE_COORDS = {
      'hotel vitacura': [-33.4072823524958, -70.59858727667945],
      'hotel el bosque': [-33.41635607885289, -70.60137591439829],
      'club de tenis': [-33.39625408309244, -70.50415154436472]
    };

    function normalize(s){
      return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function lookupLatLng(name){
      const arr = PLACE_COORDS[normalize(name)];
      return Array.isArray(arr) ? `${arr[0]},${arr[1]}` : '';
    }

    function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

    /* ------------------------- BOTONES + ESTADOS ------------------ */
    function makeRow(v){
      const id      = v.id ?? "—";
      const origenT = v.solicitud_origen || v.solicitud?.origen?.salida || "—";
      const destinoT= v.solicitud_destino || v.solicitud?.destino?.lugar || "—";
      const fecha   = fmtDateTime(v.fecha_hora_agendada || v.fecha_hora);
      const estado  = (v.estado || "—").toString().toUpperCase();

      const originLL = lookupLatLng(origenT);
      const destLL   = lookupLatLng(destinoT);

      let botones = "";

      if(estado === "ASIGNADA"){
        botones = `
          <button class="btn-action btn-start"
            data-action="maps"
            data-id="${id}"
            data-origin="${escAttr(originLL)}"
            data-dest="${escAttr(destLL)}"
            data-origin-text="${escAttr(origenT)}"
            data-dest-text="${escAttr(destinoT)}"
            data-mode="driving"
            data-next="EN_CURSO"
          >Iniciar viaje</button>

          <button class="btn-action btn-end"
            data-action="estado"
            data-id="${id}"
            data-estado="COMPLETADA"
          >Finalizar viaje</button>
        `;
      }
      else if(estado === "EN_CURSO"){
        botones = `
          <button class="btn-action btn-end"
            data-action="estado"
            data-id="${id}"
            data-estado="COMPLETADA"
          >Finalizar viaje</button>
        `;
      }
      else {
        botones = `<span class="muted">${estado}</span>`;
      }

      return `
        <tr>
          <td>${id}</td>
          <td>${origenT}</td>
          <td>${destinoT}</td>
          <td>${fecha}</td>
          <td>
            <span class="badge ${estado}">
              ${
                estado === "EN_CURSO" ? "En curso" :
                estado === "COMPLETADA" ? "Completada" :
                estado
              }
            </span>
          </td>
          <td>${botones}</td>
        </tr>
      `;
    }

    /* ------------------------ GOOGLE MAPS ------------------------- */
    document.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-action="maps"]');
      if(!el) return;

      const id       = el.dataset.id;
      const newState = el.dataset.next;

      cambiarEstado(id, newState); // Marca EN_CURSO

      const originLL = el.dataset.origin;
      const destLL   = el.dataset.dest;
      const oText    = el.dataset.originText;
      const dText    = el.dataset.destText;
      const mode     = el.dataset.mode;

      const destination = destLL || dText;
      if (!destination){
        alert("Este viaje no tiene destino definido.");
        return;
      }

      const params = new URLSearchParams({ api: '1', destination, travelmode: mode });
      if (originLL || oText) params.set('origin', originLL || oText);

      const url = `https://www.google.com/maps/dir/?${params.toString()}`;
      window.open(url, "_blank", "noopener");
    });

    /* ------------------------ CAMBIO DE ESTADO -------------------- */
    async function cambiarEstado(id, nuevoEstado){
      try {
        const res = await fetch(`${API_BASE}/reservas/${id}/`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            ...headersJSON()
          },
          body: JSON.stringify({ estado: nuevoEstado })
        });

        if(!res.ok){
          throw new Error("HTTP " + res.status);
        }

        cargarViajes();

      } catch (err) {
        alert("Error cambiando estado: " + err.message);
      }
    }

    document.addEventListener("click", (ev)=>{
      const btn = ev.target.closest("[data-action='estado']");
      if(!btn) return;

      const id = btn.dataset.id;
      const estado = btn.dataset.estado;

      cambiarEstado(id, estado);
    });

    /* ------------------------ CARGAR VIAJES ------------------------ */
    async function cargarViajes() {
      $tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Cargando viajes...</td></tr>`;
      $status.textContent = "Cargando…";

      try {
        const res = await fetch(`${API_BASE}/reservas/?conductor=${encodeURIComponent(conductorId)}`, {
          headers: headersJSON()
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const viajes = Array.isArray(data?.results) ? data.results : (Array.isArray(data) ? data : []);

        if (!viajes.length) {
          $tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay viajes asignados</td></tr>`;
          $status.textContent = "0 viaje(s)";
          return;
        }

        $tbody.innerHTML = viajes.map(makeRow).join("");
        $status.textContent = `${viajes.length} viaje(s)`;

      } catch (err) {
        console.error("Error al cargar viajes:", err);
        $tbody.innerHTML = `<tr><td colspan="6" style="color:red;text-align:center;">Error cargando viajes (${err.message})</td></tr>`;
        $status.textContent = "Sin datos (error)";
      }
    }

    /* ------------------------- LOGOUT ----------------------------- */
    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem("conductor");
      localStorage.removeItem("conductor_token");
    });

    cargarViajes();
  </script>

</body>
</html>
