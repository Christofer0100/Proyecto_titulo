<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Panel Conductor - ATP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
  <link rel="stylesheet" href="css/cdr.css">
</head>
<body>
  <div class="container">
    <aside>
      <div class="toggle">
        <div class="logo">
          <img src="imagenes/3.jpg" alt="logo">
          <h2><span class="primary">ATP</span></h2>
        </div>
        <div class="close" id="close-btn"><span class="material-icons-sharp">close</span></div>
      </div>

      <div class="sidebar">
        <a href="#"><span class="material-icons-sharp">person_outline</span><h3>Extra</h3></a>
        <a href="#" class="active"><span class="material-icons-sharp">directions_car</span><h3>Mis Viajes</h3></a>
        <a href="loginconductor.html" id="btn-logout"><span class="material-icons-sharp">logout</span><h3>Cerrar Sesión</h3></a>
      </div>
    </aside>

    <main>
      <h1>Mis Viajes</h1>

      <div class="recent-orders">
        <div class="card">
          <div class="table-wrap">
            <table class="table" aria-label="Viajes asignados">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Origen</th>
                  <th>Destino</th>
                  <th>Fecha</th>
                  <th>Estado</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tbody-viajes">
                <tr><td colspan="6" style="text-align:center;">Cargando viajes...</td></tr>
              </tbody>
            </table>
          </div>
          <div style="padding:12px;"><span id="status" class="buscar">—</span></div>
        </div>
      </div>
    </main>

    <div class="right-section">
      <div class="nav">
        <button id="menu-btn"><span class="material-icons-sharp">menu</span></button>

        <div id="theme-toggle" class="dark-mode" role="button" aria-label="Cambiar tema">
          <span class="material-icons-sharp" data-theme-target="light">light_mode</span>
          <span class="material-icons-sharp" data-theme-target="dark">dark_mode</span>
        </div>

        <div class="profile">
          <div class="info">
            <p>Hola, <b id="driverName">Conductor</b></p>
            <small class="text-muted">¡Buen viaje!</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== JS ====== -->
  <script>
    /* -------------------------
       1) Tema persistente
    ------------------------- */
    (function themeInit(){
      const toggle = document.getElementById('theme-toggle');
      const sun  = toggle.querySelector('[data-theme-target="light"]');
      const moon = toggle.querySelector('[data-theme-target="dark"]');
      function apply(theme){
        document.body.classList.toggle('dark-mode-variables', theme === 'dark');
        sun.classList.toggle('active', theme === 'light');
        moon.classList.toggle('active', theme === 'dark');
        localStorage.setItem('theme', theme);
      }
      apply(localStorage.getItem('theme') || 'light');
      toggle.addEventListener('click', () => {
        const next = document.body.classList.contains('dark-mode-variables') ? 'light' : 'dark';
        apply(next);
      });
    })();

    /* -------------------------
       2) Config/estado
    ------------------------- */
    const API_BASE = "https://bulletin-spirits-what-gmt.trycloudflare.com/api";

    const conductorData = JSON.parse(localStorage.getItem("conductor"));
    const conductorId   = conductorData?.id || null;
    const driverNameEl  = document.getElementById('driverName');

    if (!conductorId) {
      alert("Por favor, inicia sesión nuevamente.");
      window.location.href = "loginconductor.html";
    } else {
      const nombre = [conductorData?.nombre, conductorData?.apellido].filter(Boolean).join(' ').trim();
      if (nombre) driverNameEl.textContent = nombre;
    }

    const $tbody  = document.getElementById("tbody-viajes");
    const $status = document.getElementById("status");

    function headersJSON() {
      const h = { "Accept": "application/json" };
      const bearer = localStorage.getItem("conductor_token");
      if (bearer) h["Authorization"] = "Bearer " + bearer;
      return h;
    }
    function fmtDateTime(s){
      if(!s) return "-";
      const d = new Date(s);
      return isNaN(+d) ? "-" : d.toLocaleString();
    }

    /* -------------------------
       3) Mapeo NOMBRE → COORDENADAS
          ✱ EDITA AQUÍ LAS COORDENADAS ✱
          Formato: 'nombre normalizado': [lat, lng]
          (normalizado = sin tildes, en minúsculas)
    ------------------------- */
    const PLACE_COORDS = {
      'hotel vitacura':   [-33.4072823524958, -70.59858727667945],  // TODO: reemplazar por coordenadas reales
      'hotel el bosque':  [-33.41635607885289, -70.60137591439829],  // TODO: reemplazar por coordenadas reales
      'club de tenis':    [-33.39625408309244, -70.50415154436472]   // TODO: tercer lugar (ejemplo)
    };

    function normalize(s){
      return (s || '')
        .toString()
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .trim();
    }
    function lookupLatLng(name){
      const key = normalize(name);
      const arr = PLACE_COORDS[key];
      return Array.isArray(arr) && arr.length === 2 ? `${arr[0]},${arr[1]}` : '';
    }
    function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

    /* -------------------------
       4) Render tabla
    ------------------------- */
    function makeRow(v){
      const id      = v.id ?? "—";
      const origenT = v.solicitud_origen || v.solicitud?.origen?.salida || "—";
      const destinoT= v.solicitud_destino || v.solicitud?.destino?.lugar || "—";
      const fecha   = fmtDateTime(v.fecha_hora_agendada || v.fecha_hora);
      const estado  = (v.estado || "—").toString().toUpperCase();

      // Coordenadas por nombre (si existen)
      const originLL = lookupLatLng(origenT);
      const destLL   = lookupLatLng(destinoT);

      const btn = (estado === "ASIGNADA")
        ? `<button class="btn secondary btn-sm"
             data-action="maps"
             data-origin="${escAttr(originLL)}"
             data-dest="${escAttr(destLL)}"
             data-origin-text="${escAttr(origenT)}"
             data-dest-text="${escAttr(destinoT)}"
             data-mode="driving">Iniciar viaje</button>`
        : `<span class="muted">${estado}</span>`;

      return `
        <tr>
          <td>${id}</td>
          <td>${origenT}</td>
          <td>${destinoT}</td>
          <td>${fecha}</td>
          <td><span class="badge ${estado}">${estado}</span></td>
          <td>${btn}</td>
        </tr>
      `;
    }

    /* -------------------------
       5) Abrir Google Maps con coordenadas
          Usa lat,lng cuando están disponibles;
          si no, cae a texto (búsqueda de Maps).
    ------------------------- */
    document.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-action="maps"]');
      if(!el) return;

      const originLL = (el.getAttribute('data-origin') || '').trim();      // "lat,lng" o ""
      const destLL   = (el.getAttribute('data-dest')   || '').trim();      // "lat,lng" o ""
      const oText    = (el.getAttribute('data-origin-text') || '').trim(); // fallback por texto
      const dText    = (el.getAttribute('data-dest-text')   || '').trim();
      const mode     = (el.getAttribute('data-mode') || 'driving');

      // destino es obligatorio (coordenadas o texto)
      const destination = destLL || dText;
      if (!destination){
        alert("Este viaje no tiene destino definido.");
        return;
      }

      const params = new URLSearchParams({ api: '1', destination, travelmode: mode });
      if (originLL || oText) params.set('origin', originLL || oText);

      const url = `https://www.google.com/maps/dir/?${params.toString()}`;
      window.open(url, "_blank", "noopener");
    });

    /* -------------------------
       6) Cargar viajes
    ------------------------- */
    async function cargarViajes() {
      $tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Cargando viajes...</td></tr>`;
      $status.textContent = "Cargando…";
      try {
        const res = await fetch(`${API_BASE}/reservas/?conductor=${encodeURIComponent(conductorId)}`, { headers: headersJSON() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const viajes = Array.isArray(data?.results) ? data.results : (Array.isArray(data) ? data : []);

        if (!viajes.length) {
          $tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay viajes asignados</td></tr>`;
          $status.textContent = "0 viaje(s)";
          return;
        }

        $tbody.innerHTML = viajes.map(makeRow).join("");
        $status.textContent = `${viajes.length} viaje(s)`;
      } catch (err) {
        console.error("Error al cargar viajes:", err);
        $tbody.innerHTML = `<tr><td colspan="6" style="color:red;text-align:center;">Error cargando viajes (${err.message})</td></tr>`;
        $status.textContent = "Sin datos (error)";
      }
    }

    /* -------------------------
       7) Logout e init
    ------------------------- */
    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem("conductor");
      localStorage.removeItem("conductor_token");
    });

    cargarViajes();
  </script>

  <script src="/js/coordinador.js"></script>
</body>
</html>
